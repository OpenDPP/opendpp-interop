name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate samples + schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # Node 20 is EOL (2026-04-30); 22 is Active LTS (EOL 2027-04-30).
          cache: npm
          cache-dependency-path: validate/package-lock.json
      - name: Install validator deps
        working-directory: validate
        run: npm ci
      - name: Validate every sample (official schemas + CIRPASS-2 pointer + OpenDPP SHACL shapes)
        run: |
          set -e
          node validate/validate.mjs aas      samples/battery-aas-environment.json
          # Every per-category AAS sample (#114/#115): extract the AAS Environment from each .aasx
          # (OPC/ZIP, at aasx/data/environment.json) and validate it against the official IDTA AAS
          # metamodel 3.1 JSON Schema (aas-specs v3.1.2), official IDTA-01001-3-1. The same 9 .aasx are
          # also validated against the stricter IDTA `aas-test-engines` 3.0 metamodel gold standard in
          # OpenDPP's backend CI.
          for aasx in samples/*.aasx; do
            unzip -p "$aasx" aasx/data/environment.json > /tmp/aas-env.json
            echo "aas: $aasx"; node validate/validate.mjs aas /tmp/aas-env.json
          done
          node validate/validate.mjs untp     samples/battery-vc-credential.json
          node validate/validate.mjs untp     samples/battery-unit-vc-credential.json
          node validate/validate.mjs untp     samples/textile-vc-credential.json

          node validate/validate.mjs registry samples/battery-registry-pointer-model.json
          node validate/validate.mjs registry samples/battery-registry-pointer-item.json
          node validate/validate.mjs shacl    samples/battery-passport.jsonld
          node validate/validate.mjs sdjwt    samples/battery-vc.sdjwt
          node validate/validate.mjs sdjwt    samples/battery-vc-presented.sdjwt
          node validate/validate.mjs sdjwt    samples/battery-unit-vc.sdjwt
          node validate/validate.mjs epcis    samples/epcis-document.json
          node validate/validate.mjs gs1      samples/gs1-digital-link.txt
      - name: SD-JWT-VC negative control (a forged disclosure MUST be rejected)
        run: |
          set -e
          node -e "const fs=require('fs');const p=fs.readFileSync('samples/battery-vc.sdjwt','utf8').trim().split('~');p[1]=Buffer.from('[\"x\",\"materialProvenance\",[{\"name\":\"Gold\"}]]').toString('base64url');fs.writeFileSync('samples/_bad.sdjwt',p.join('~'))"
          if node validate/validate.mjs sdjwt samples/_bad.sdjwt; then echo "ERROR: forged SD-JWT-VC unexpectedly verified" && rm -f samples/_bad.sdjwt && exit 1; else echo "ok: SD-JWT-VC rejected the forged disclosure"; fi
          rm -f samples/_bad.sdjwt
      - name: SHACL negative control (a tampered passport MUST be rejected)
        run: |
          set -e
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('samples/battery-passport.jsonld','utf8'));j.status='BOGUS_STATUS';fs.writeFileSync('/tmp/bad.jsonld',JSON.stringify(j))"
          if node validate/validate.mjs shacl /tmp/bad.jsonld; then echo "ERROR: tampered passport unexpectedly conformed" && exit 1; else echo "ok: SHACL rejected the tampered passport"; fi
      - name: GS1 negative control (a bad GTIN check digit MUST be rejected)
        run: |
          set -e
          echo 'https://id.gs1.org/01/09501101532006' > /tmp/bad-gs1.txt
          if node validate/validate.mjs gs1 /tmp/bad-gs1.txt; then echo "ERROR: a bad GTIN check digit unexpectedly conformed" && exit 1; else echo "ok: GS1 engine rejected the bad check digit"; fi
      - name: Classify AAS semanticIds against the IDTA allowlist (identity)
        # Non-strict (warns on unverified ids) — matches the OpenDPP backend gate. The sample's TechnicalData
        # submodel carries element-level IDTA ids (e.g. https://admin-shell.io/ZVEI/TechnicalData/…/1/1) that a
        # submodel-level registry snapshot cannot auto-verify; --strict would wrongly reject those legitimate
        # IDTA template element ids. Deprecated-id detection still warns; the positive assertions are below.
        run: node validate/validate.mjs semanticids samples/battery-aas-environment.json
      - name: Assert classifier behaviour (CarbonFootprint is a published IDTA id)
        run: |
          node -e "
            import('./validate/semantic-ids.mjs').then(m => {
              const cf = 'https://admin-shell.io/idta/CarbonFootprint/CarbonFootprint/1/0';
              const v = m.classifySemanticId(cf);
              if (v !== 'real-idta-published') { console.error('expected real-idta-published, got ' + v); process.exit(1); }
              if (m.classifySemanticId('urn:opendpp:submodel:batteries:characteristics') !== 'vendor-coined') process.exit(1);
              if (m.classifySemanticId('0173-1#02-BAF123#001') !== 'eclass') process.exit(1);
              console.log('ok: semanticId classifier verdicts');
            });
          "
      - name: JSON sanity (spec + schemas + allowlist parse)
        run: |
          set -e
          for f in openapi.json idta-semantic-ids.json schemas/aas-v3.schema.json schemas/untp-dpp-v0.7.0.schema.json schemas/cirpass2-eu-registry-pointer.schema.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('ok: $f')"
          done

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        env:
          # Pinned so the scan never depends on an unauthenticated, rate-limited
          # `releases/latest` API call at runtime (the old lookup flaked and aborted
          # the job before gitleaks even ran). Bump deliberately.
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-all-errors "$url" | tar -xz gitleaks; then
              break
            fi
            echo "gitleaks download failed (attempt $attempt) — retrying" >&2
            sleep $((attempt * 5))
          done
          test -x ./gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
