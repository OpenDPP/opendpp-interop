name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate samples + schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install validator deps
        working-directory: validate
        run: npm ci
      - name: Validate every sample (official schemas + CIRPASS-2 pointer + OpenDPP SHACL shapes)
        run: |
          set -e
          node validate/validate.mjs aas      samples/battery-aas-environment.json
          node validate/validate.mjs untp     samples/battery-vc-credential.json
          node validate/validate.mjs untp     samples/battery-unit-vc-credential.json
          node validate/validate.mjs registry samples/battery-registry-pointer-model.json
          node validate/validate.mjs registry samples/battery-registry-pointer-item.json
          node validate/validate.mjs shacl    samples/battery-passport.jsonld
      - name: SHACL negative control (a tampered passport MUST be rejected)
        run: |
          set -e
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('samples/battery-passport.jsonld','utf8'));j.status='BOGUS_STATUS';fs.writeFileSync('/tmp/bad.jsonld',JSON.stringify(j))"
          if node validate/validate.mjs shacl /tmp/bad.jsonld; then echo "ERROR: tampered passport unexpectedly conformed" && exit 1; else echo "ok: SHACL rejected the tampered passport"; fi
      - name: Classify AAS semanticIds against the IDTA allowlist (identity)
        run: node validate/validate.mjs semanticids samples/battery-aas-environment.json --strict
      - name: Assert classifier behaviour (CarbonFootprint is a published IDTA id)
        run: |
          node -e "
            import('./validate/semantic-ids.mjs').then(m => {
              const cf = 'https://admin-shell.io/idta/CarbonFootprint/CarbonFootprint/1/0';
              const v = m.classifySemanticId(cf);
              if (v !== 'real-idta-published') { console.error('expected real-idta-published, got ' + v); process.exit(1); }
              if (m.classifySemanticId('urn:opendpp:submodel:batteries:characteristics') !== 'vendor-coined') process.exit(1);
              if (m.classifySemanticId('0173-1#02-BAF123#001') !== 'eclass') process.exit(1);
              console.log('ok: semanticId classifier verdicts');
            });
          "
      - name: JSON sanity (spec + schemas + allowlist parse)
        run: |
          set -e
          for f in openapi.json idta-semantic-ids.json schemas/aas-v3.schema.json schemas/untp-dpp-v0.7.0.schema.json schemas/cirpass2-eu-registry-pointer.schema.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('ok: $f')"
          done

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          set -e
          ver=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
